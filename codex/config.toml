# Codex CLI のユーザー設定。claude/settings.json と対になる内容にしている。
# 検証: codex --strict-config exec --skip-git-repo-check hi (doctorは不可。[tui]内の誤字はこれでも検出不可)

# claude の model: "sonnet" に相当。ファミリーエイリアスが無いため ID を直書きする。
model = "gpt-5.6-terra"

# alwaysThinkingEnabled + effortLevel: "high" に相当。Codex は常時推論のため深さのみ指定。
model_reasoning_effort = "high"

# permissions.defaultMode: "auto" に相当。sandbox_mode とは独立な設定。
approval_policy = "on-request"
# 制限なし全アクセス。approval_policy とは独立なので承認後もサンドボックスに縛られない。
sandbox_mode = "danger-full-access"

[features]
# multi_agent は stable でデフォルト有効。multi_agent_v2 は stable だがデフォルト無効のため明示的に有効化。
multi_agent_v2 = true

[tui]
# editorMode: "vim" に対応する。
vim_mode_default = true

# danger-full-access の警告を意図的に抑制している。
hide_full_access_warning = true

# claude/statusline-command.sh の表示に対応。vim モード相当の項目は無く、並び順・書式も指定不可。
status_line = [
    "model-with-reasoning",
    "fast-mode",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]

[tui.keymap.global]
# デフォルトの esc esc (2回押し) は Create task との誤爆が多いため left に変更する。
open_agents = ["left"]

name: Features

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'features/**'
      - '.github/workflows/features.yaml'
      # features/assets.tsv の複製元。ここが変わったら feature も作り直す
      - 'claude/statusline-command.sh'
      - 'claude/settings.json'
      - 'claude/keybindings.json'
      - 'codex/config.toml'
  push:
    branches: [main]
    paths:
      - 'features/**'
      - '.github/workflows/features.yaml'
      - 'claude/statusline-command.sh'
      - 'claude/settings.json'
      - 'claude/keybindings.json'
      - 'codex/config.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      # 複製元は claude/ などリポジトリルート側。tarball に入るよう feature へ複製する。
      # --verify は、対応表に足したのに paths や .gitignore を直し忘れた場合に落とす
      - name: Sync feature assets
        run: |
          ./features/sync-assets.sh --verify
          ./features/sync-assets.sh

      # --features で絞らないので features/test/ 配下の全 feature が対象になる。
      # feature を増やしたときに、ここを直し忘れて未テストのまま publish される
      # のを防ぐため、あえて列挙しない。
      # --base-image の既定は vscode ユーザーの居ない ubuntu:focal なので明示する。
      - name: Test features
        run: |
          devcontainer features test \
            --project-folder ./features \
            --base-image mcr.microsoft.com/devcontainers/base:ubuntu \
            --remote-user vscode

  release:
    # テストが通るまで publish しない。needs は同一 workflow 内でしか張れないので、
    # test と release を 1 ファイルにまとめている。
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # devcontainers/action は publish 後に feature_<id>_<version> の git タグを
      # 打つので、read だと publish 自体は通るがタグ付けだけ失敗する
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync feature assets
        run: ./features/sync-assets.sh

      # features/src/<id>/ を ghcr.io/<owner>/<repo>/<id> として publish する。
      # 複製元だけ変えて version を据え置くと、workflow は走るが publish はスキップ
      # される (同一 version は上書きしない)。反映したいなら version を上げること。
      # 既に存在するバージョンはスキップされるので、version を上げない限り無害。
      - name: Publish features
        uses: devcontainers/action@v1
        with:
          publish-features: 'true'
          base-path-to-features: ./features/src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Features

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'features/**'
      - '.github/workflows/features.yaml'
      # features/assets.tsv の複製元。ここが変わったら feature も作り直す
      - 'claude/statusline-command.sh'
      - 'claude/settings.json'
      - 'claude/keybindings.json'
      - 'codex/config.toml'
      - 'copilot/statusline-command.sh'
      - 'copilot/settings.json'
  push:
    branches: [main]
    paths:
      - 'features/**'
      - '.github/workflows/features.yaml'
      - 'claude/statusline-command.sh'
      - 'claude/settings.json'
      - 'claude/keybindings.json'
      - 'codex/config.toml'
      - 'copilot/statusline-command.sh'
      - 'copilot/settings.json'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      # --verify で対応表・paths・.gitignore の追随漏れを検査してから複製する
      - name: Sync feature assets
        run: |
          ./features/sync-assets.sh --verify
          ./features/sync-assets.sh

      # --features で絞らない (feature 追加時の列挙し忘れを防ぐため)。--base-image は既定が ubuntu:focal で vscode が居ないので明示する。
      - name: Test features
        run: |
          devcontainer features test \
            --project-folder ./features \
            --base-image mcr.microsoft.com/devcontainers/base:ubuntu \
            --remote-user vscode

  release:
    # needs は同一 workflow 内でしか張れないので test と release を 1 ファイルにまとめている
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # publish 後の git タグ付けに要る (read だとタグ付けだけ失敗する)
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync feature assets
        run: ./features/sync-assets.sh

      # 反映するには version を上げる必要がある (同一 version は publish されない)
      - name: Publish features
        uses: devcontainers/action@v1
        with:
          publish-features: 'true'
          base-path-to-features: ./features/src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
